<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A Place That Doesn't Exist — V3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="noise"></div>
  <div class="stars stars-a"></div><div class="stars stars-b"></div><div class="nebula nebula-a"></div><div class="nebula nebula-b"></div>

  <main id="app">
    <section class="landing screen" id="landing">
      <div class="landing-copy">
        <p class="eyebrow">A PLACE THAT DOESN'T EXIST</p>
        <h1>I Made<br><span>Something</span><br>For You</h1>
        <p class="landing-sub">A little universe made out of things I never knew how to say.</p>
        <button class="enter-btn" data-enter>ENTER THE UNIVERSE <span>↗</span></button>
      </div>
    </section>

    <section class="universe screen hidden" id="universe">
      <header class="topbar"><span>FOR TIFFANY</span><span class="topbar-dot">●</span><span>V3 / 2026</span></header>
      <div class="scene">
        <div class="black-hole-wrap" aria-label="Black hole">
          <div class="accretion outer"></div>
          <div class="accretion middle"></div>
          <div class="accretion inner"></div>
          <div class="event-horizon"></div>
          <div class="lens-glow"></div>
        </div>
        <div class="orbit orbit-1"></div><div class="orbit orbit-2"></div>
        <button class="node node-1" data-section="signal"><span class="node-icon">✦</span><span>THE SIGNAL</span></button>
        <button class="node node-2" data-section="between"><span class="node-icon">∞</span><span>BETWEEN US</span></button>
        <button class="node node-3" data-section="little"><span class="node-icon">✧</span><span>THE LITTLE THINGS</span></button>
        <button class="node node-4" data-section="frequency"><span class="node-icon">♪</span><span>FREQUENCY</span></button>
        <p class="scene-caption">Somewhere between all the stars,<br>I found a place that feels like you.</p>
      </div>
      <div class="hint">TAP AN ORBITING OBJECT</div>
    </section>

    <div class="modal hidden" id="modal" aria-hidden="true">
      <div class="modal-backdrop" data-close></div>
      <article class="modal-card" role="dialog" aria-modal="true">
        <button class="close" data-close aria-label="Close">×</button>
        <div class="modal-kicker" id="modalKicker"></div>
        <h2 id="modalTitle"></h2>
        <div class="modal-body" id="modalBody"></div>
      </article>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
